# =============================================================================
# K230 矩形靶标追踪 — 配置参考模板
# =============================================================================
# 运行时配置文件为 k230/config.json (JSON格式, CanMV兼容)
# 本文件为完整参数参考, 包含所有可调项及说明
# =============================================================================

# ============================================================================
# 一、检测模式
# ============================================================================
detection:
  # "cv"=经典视觉矩形检测 / "yolo"=KPU推理 / "hybrid"=CV优先
  mode: "cv"

  # 跳帧检测: 1=每帧, 2=隔帧(帧率翻倍), 3=每3帧
  detect_every: 1

# ============================================================================
# 二、摄像头
# ============================================================================
camera:
  sensor_width: 640       # 传感器输出宽度
  sensor_height: 480      # 传感器输出高度
  fps: 90                 # 传感器帧率

# ============================================================================
# 三、降采样检测 (提速用)
# ============================================================================
detect_resolution:
  enabled: false          # 开启=低分辨率检测(1/4像素), 关闭=原版640x480
  width: 320              # 检测宽度 (建议为sensor_width的1/2)
  height: 240             # 检测高度 (建议为sensor_height的1/2)

# ============================================================================
# 四、画面中心 / 激光偏移
# ============================================================================
center:
  x: 320                  # 画面中心X (= sensor_width/2)
  y: 240                  # 画面中心Y (= sensor_height/2)
  laser_offset_x: 0       # 激光光斑X偏移(标定值, 右侧为正)
  laser_offset_y: 0       # 激光光斑Y偏移(标定值, 下方为正)

# ============================================================================
# 五、矩形检测阈值 (现场调参入口)
# ============================================================================
rectangle:
  # -- 颜色阈值 --
  white_low:  [135, 135, 115]    # 白色掩膜RGB下界
  white_high: [255, 255, 255]    # 白色掩膜RGB上界
  black_low:  [0, 0, 0]          # 黑色边框RGB下界
  black_high: [85, 85, 85]       # 黑色边框RGB上界

  # -- 面积过滤 --
  min_area: 3500          # 最小矩形面积(px²), 过滤噪点
  max_area: 180000        # 最大矩形面积(px²), 过滤全画面

  # -- 宽高比 --
  min_aspect: 1.05        # 最小宽高比
  max_aspect: 2.80        # 最大宽高比
  target_aspect: 1.55     # 目标宽高比(评分权重)

  # -- 边框扩展 --
  border_expand_x: 16     # X方向扩展像素
  border_expand_y: 16     # Y方向扩展像素

  # -- 黑边验证 --
  black_check_step: 4     # 黑边检测步长
  min_black_hits: 3       # 最少黑边命中数(4边中至少3边)

  # -- 白心验证 --
  center_white_step: 3    # 中心白色区域占比阈值

  # -- 时空过滤 --
  max_center_jump: 220    # 帧间中心最大跳跃(px), 超过则忽略
  max_area_ratio: 3       # 帧间面积最大变化比例

  # -- 四边形质量 --
  min_rect_fill: 45       # 轮廓填充率下限(%), 过滤空心/残缺矩形
  max_side_ratio: 3       # 对边长度比上限
  approx_epsilon: 0.04    # approxPolyDP精度(轮廓周长的4%)

# ============================================================================
# 六、YOLO KPU模式
# ============================================================================
yolo:
  model_path: "/sdcard/model/model.kmodel"
  labels: ["target"]
  confidence: 0.3         # 置信度阈值 (0.1-0.7)
  nms_threshold: 0.4      # NMS阈值 (0.2-0.6)
  input_size: [320, 320]  # 模型输入尺寸
  max_boxes: 30           # 最大检测框数

# ============================================================================
# 七、卡尔曼滤波 (EMA)
# ============================================================================
kalman:
  enabled: false           # 开启=平滑去抖, 关闭=原始输出(更快)
  smooth_factor: 0.3       # 平滑系数: 0=完全平滑, 1=不过滤, 推荐0.2-0.6

# ============================================================================
# 八、跟踪
# ============================================================================
tracking:
  smooth_num: 0            # 指数平滑分子: 0=不平滑, 1=偏旧, 2=更偏旧
  smooth_den: 1            # 指数平滑分母: new=(old*num+new)/den
  lost_keep_frames: 2      # 丢失保持帧数: 遮挡后复用旧位置的最大帧数

# ============================================================================
# 九、串口通信 (云台)
# ============================================================================
uart:
  enabled: true            # 接STM32云台时开启
  port: 2                  # K230 UART端口号
  baud: 115200             # 波特率 (与STM32一致)
  format: "csv"            # 协议: "dx,dy,dist,status\n"
  #   status: 0=追踪中, 1=已对准, 404=目标丢失

# ============================================================================
# 十、显示
# ============================================================================
display:
  lcd_width: 800
  lcd_height: 480
  show_osd: true           # 是否叠加OSD信息(dx,dy,dist,FPS)
  x_offset: 80
  y_offset: 0
  to_ide: false            # 是否同时输出到CanMV IDE

# ============================================================================
# 十一、调试
# ============================================================================
debug:
  print_every: 60          # 每N帧串口打印一次 (降低=更频繁, 但拖慢帧率)
  gc_every: 30             # 每N帧GC一次 (太频繁拖慢, 太稀疏卡顿)
