# K230 + STM32F407 矩形靶标追踪 — 配置文件
# 部署路径: /sdcard/app/config.yaml (K230 Linux模式)
# CanMV模式直接在 k230/main.py 中修改参数

# ============================================================================
# 检测模式
# ============================================================================
detection:
  mode: "cv"    # cv / yolo / hybrid

# ============================================================================
# 摄像头
# ============================================================================
camera:
  width: 800
  height: 480
  fps: 30
  sensor_id: 2

# ============================================================================
# 检测分辨率（低分辨率加速检测）
# ============================================================================
detect:
  width: 400
  height: 240

# ============================================================================
# 画面中心 & 激光偏移
# ============================================================================
center:
  x: 400    # CAM_WIDTH / 2
  y: 240    # CAM_HEIGHT / 2
  laser_offset_x: 0
  laser_offset_y: 0

# ============================================================================
# 矩形检测 (cv模式)
# ============================================================================
rectangle:
  find_rects_threshold: 10000
  area_min: 100
  aspect_ratio_min: 1.0
  aspect_ratio_max: 3.0
  angle_tolerance: 25

# ============================================================================
# YOLO检测 (yolo模式)
# ============================================================================
yolo:
  model_path: "/sdcard/model/model.kmodel"
  labels: ["target"]
  confidence: 0.3
  nms_threshold: 0.4
  input_size: [320, 320]

# ============================================================================
# 追踪
# ============================================================================
tracking:
  tolerance_x: 5
  tolerance_y: 5
  confirm_frames: 12
  lost_timeout_ms: 2000
  ring_buffer_size: 16

# ============================================================================
# 串口通信
# ============================================================================
uart:
  port: 2
  baud: 115200
  format: "csv"

# ============================================================================
# 显示
# ============================================================================
display:
  show_osd: true
  print_info: true
  fps_report_interval: 30
